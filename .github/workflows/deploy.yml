name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Architecture, naming, and lint guard
        run: bun run check:architecture

      - name: Verify Drizzle migrations are committed
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: bun run check:migrations

      - name: Apply reviewed Neon migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run db:migrate

      - name: Deploy Worker
        id: worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify --env=""
          secrets: |
            DATABASE_URL
            BETTER_AUTH_SECRET
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Smoke test deployed Worker
        env:
          WORKER_URL: ${{ steps.worker.outputs.deployment-url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$WORKER_URL/health"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$WORKER_URL/openapi.json" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "$WORKER_URL/docs" > /dev/null
