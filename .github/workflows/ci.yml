name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Architecture, naming, and lint guard
        run: bun run check:architecture

      - name: Verify Drizzle migrations are committed
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: bun run check:migrations

      - name: Validate Worker deployment configuration
        run: bunx wrangler deploy --dry-run --env=""
